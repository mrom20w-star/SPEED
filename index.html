    <style>
      #initial-entry-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      #initial-entry-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #fafafa;
        letter-spacing: 0.02em;
        text-align: center;
        padding: 0 10px;
      }
    </style>
  </head>
  <body class="bg-[#080808] text-white selection:bg-white selection:text-[#080808] overflow-x-hidden m-0 p-0">
    <div id="root">
      <!-- Instant First-Frame Entry Overlay: Appears in 0.01s without waiting for JavaScript -->
      <div id="initial-entry-overlay">
        <div id="initial-entry-text">click to enter...</div>
      </div>
    </div>
    <script>
      window.__entered = false;
      document.addEventListener('click', function onFirstClick() {
        var el = document.getElementById('initial-entry-overlay');
        if (el) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function() {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 150);
          window.__entered = true;
          window.dispatchEvent(new Event('app:entered'));
        }
      }, { once: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
